services:
  ctfd:
    build: .
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${CTFD_BIND_ADDRESS:-127.0.0.1}:${CTFD_PORT:-8001}:8000"
    environment:
      SECRET_KEY: "${CTFD_SECRET_KEY:?Set CTFD_SECRET_KEY in .env}"
      DATABASE_URL: "mysql+pymysql://ctfd:${CTFD_DB_PASSWORD:?Set CTFD_DB_PASSWORD in .env}@db/ctfd?charset=utf8mb4"
      REDIS_URL: redis://cache:6379/0
      UPLOAD_FOLDER: /var/uploads
      LOG_FOLDER: /var/log/CTFd
      REVERSE_PROXY: "${CTFD_REVERSE_PROXY:-false}"
      CHRISTMAS_TREE_CHALLENGE_IDS: "${CHRISTMAS_TREE_CHALLENGE_IDS:-}"
      CHRISTMAS_TREE_STARTING_POINTS: "${CHRISTMAS_TREE_STARTING_POINTS:-30000}"
      CHRISTMAS_TREE_POINTS_PER_SOLVE: "${CHRISTMAS_TREE_POINTS_PER_SOLVE:-500}"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/login', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    volumes:
      - uploads:/var/uploads
      - logs:/var/log/CTFd
    networks:
      - default
      - backend

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ctfd
      MARIADB_USER: ctfd
      MARIADB_PASSWORD: "${CTFD_DB_PASSWORD:?Set CTFD_DB_PASSWORD in .env}"
      MARIADB_ROOT_PASSWORD: "${CTFD_DB_ROOT_PASSWORD:?Set CTFD_DB_ROOT_PASSWORD in .env}"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - database:/var/lib/mysql
    networks:
      - backend

  cache:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - cache:/data
    networks:
      - backend

networks:
  backend:
    internal: true

volumes:
  uploads:
  logs:
  database:
  cache:
